<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../_loader.js"></script>
<style>body{padding:20px 24px} .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
loadSoulDS('../../').then(NS => {
  const { Button, TextLink, IconButton } = NS;
  const App = () => <div style={{display:'flex',flexDirection:'column',gap:16}}>
    <div><div className="k">Light ground</div><div style={{display:'flex',flexWrap:'wrap',gap:12,alignItems:'center'}}><Button arrow>Khám phá cà phê</Button><Button variant="outline">Câu chuyện của Soul</Button><Button variant="outline" size="xs">Thêm vào giỏ</Button><Button disabled size="s">Disabled</Button><TextLink>Xem tất cả cà phê</TextLink></div></div>
    <div style={{background:'var(--surface-inverse)',padding:16}}><div className="k" style={{color:'var(--paper-a70)'}}>Ink ground</div><div style={{display:'flex',flexWrap:'wrap',gap:12,alignItems:'center'}}><Button variant="accent" arrow>Khám phá Soulful 2026</Button><Button variant="outline-dark" size="s" arrow>Tìm hiểu về Soul</Button><Button variant="outline-dark-accent" size="xs">Thêm vào giỏ</Button><TextLink tone="dark" arrow="↓">Tất cả sản phẩm</TextLink></div></div>
    <div style={{display:'flex',gap:8,alignItems:'center',background:'var(--surface-alt)',padding:10}}><IconButton icon="arrow-left" variant="round" label="Prev"/><IconButton icon="arrow-right" variant="round" label="Next"/><IconButton icon="search" label="Search"/><IconButton icon="menu" label="Menu"/><IconButton icon="close" label="Close"/></div>
  </div>;
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
