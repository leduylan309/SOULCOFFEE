<!-- @dsCard group="Components" viewport="700x560" name="Commerce" subtitle="Product, category, collection, Soulful cards & cart line" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../_loader.js"></script>
<style>body{padding:20px 24px} .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
loadSoulDS('../../').then(NS => {
  const { ProductCard, CategoryTile, CollectionCard, SoulfulCard, CartLine } = NS;
  const App = () => <div style={{display:'flex',flexDirection:'column',gap:10}}>
    <div style={{display:'grid',gridTemplateColumns:'1.1fr 1fr 1fr 1fr',gap:10,alignItems:'start'}}>
      <ProductCard img="../../images/02-featured/espresso_fine_ro.jpg" badge="Pha máy" type="Cà phê rang · Fine Robusta" name="Origin Espresso — Fine Robusta" notes="Cacao, mật ong, ca-ra-men" meta="Buôn Ma Thuột · Robusta TR" />
      <CategoryTile img="../../images/02-shop/Phin.jpg" name="Pha phin" />
      <CategoryTile img="../../images/02-shop/Espresso.jpg" name="Pha máy" />
      <SoulfulCard img="../../images/04-soulful/Soulful-Cay.jpg" word="Cay" method="Pha phin" process="Fine Robusta TR Red Honey" />
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
      <CollectionCard index="01" title="Cà phê rang" img="../../images/02-shop/CA-PHE-RANG.jpg" linkLabel="Tất cả sản phẩm" />
      <div style={{background:'var(--surface-page)',border:'1px solid var(--line-subtle)',padding:'0 16px'}}><CartLine img="../../images/04-soulful/Soulful-Nong.jpg" name="Soulful — Nồng" type="Pha máy · Fine Robusta TR Soul Yeast" qty={2} /></div>
    </div>
  </div>;
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
