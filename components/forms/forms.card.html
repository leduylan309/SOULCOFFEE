<!-- @dsCard group="Components" viewport="700x360" name="Forms" subtitle="Underline fields, chips, toggles, stepper, newsletter" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../_loader.js"></script>
<style>body{padding:20px 24px} .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
loadSoulDS('../../').then(NS => {
  const { TextField, TextArea, ChipToggle, LangToggle, QuantityStepper, NewsletterForm } = NS;
  const App = () => { const [p,setP]=React.useState([0]); const [l,setL]=React.useState('vi'); const [q,setQ]=React.useState(1);
    return <div style={{display:'flex',flexDirection:'column',gap:18}}>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'18px 20px'}}><TextField label="Họ tên" required /><TextField label="Email" type="email" required /><TextArea label="Nội dung cần trao đổi" rows={2} style={{gridColumn:'1/-1'}} /></div>
    <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>{['Nhân xanh','Cà phê rang','Đào tạo'].map((t,i)=><ChipToggle key={i} pressed={p.includes(i)} onClick={()=>setP(p.includes(i)?p.filter(x=>x!==i):[...p,i])}>{t}</ChipToggle>)}<span style={{width:16}}></span><LangToggle value={l} onChange={setL}/><QuantityStepper value={q} onInc={()=>setQ(q+1)} onDec={()=>setQ(Math.max(1,q-1))}/></div>
    <div style={{background:'var(--surface-highlight)',padding:'4px 16px 16px'}}><NewsletterForm /></div>
  </div>; };
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
