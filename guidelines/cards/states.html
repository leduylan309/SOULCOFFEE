<!-- @dsCard group="Interaction" viewport="700x220" subtitle="Hover = instant fill swap to yellow or ink; no transitions" name="Hover & focus" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px 24px;background:var(--surface-page)} .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)} .code{font-size:11px;color:var(--text-secondary);font-family:ui-monospace,Menlo,monospace}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:500"><div><div style="height:50px;display:grid;place-items:center;background:var(--soul-ink);color:var(--soul-paper)">Thêm vào giỏ</div><div class="lbl" style="margin-top:8px">Primary rest</div></div><div><div style="height:50px;display:grid;place-items:center;background:var(--soul-yellow);color:var(--soul-ink)">Thêm vào giỏ</div><div class="lbl" style="margin-top:8px">Primary hover</div></div><div><div style="height:50px;display:grid;place-items:center;border:1px solid var(--soul-ink)">Thêm vào giỏ</div><div class="lbl" style="margin-top:8px">Outline rest</div></div><div><div style="height:50px;display:grid;place-items:center;background:var(--soul-ink);color:var(--soul-paper)">Thêm vào giỏ</div><div class="lbl" style="margin-top:8px">Outline hover</div></div></div><div style="display:flex;gap:24px;margin-top:18px;align-items:center"><a style="font-size:15px;color:var(--soul-clay)">Link hover → clay</a><span style="padding:6px 10px;outline:2px solid var(--focus-ring);outline-offset:3px;font-size:13px">Focus ring · 2px yellow, offset 3</span><span style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;padding-bottom:8px;border-bottom:2px solid var(--soul-yellow)">Nav hover underline</span></div>
</body></html>
