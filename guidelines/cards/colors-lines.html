<!-- @dsCard group="Colors" viewport="700x170" subtitle="Hairlines are ink at low alpha; solid ink for emphasis" name="Lines & borders" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px 24px;background:var(--surface-page)} .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)} .code{font-size:11px;color:var(--text-secondary);font-family:ui-monospace,Menlo,monospace}</style></head><body>
<div style="display:flex;flex-direction:column;gap:14px"><div style="display:grid;grid-template-columns:200px 1fr;align-items:center;gap:16px"><span class="code">--line-subtle · 12% · list rows</span><span style="height:1px;background:var(--line-subtle)"></span></div><div style="display:grid;grid-template-columns:200px 1fr;align-items:center;gap:16px"><span class="code">--line-default · 14% · header, panels</span><span style="height:1px;background:var(--line-default)"></span></div><div style="display:grid;grid-template-columns:200px 1fr;align-items:center;gap:16px"><span class="code">--line-strong · 20% · section dividers</span><span style="height:1px;background:var(--line-strong)"></span></div><div style="display:grid;grid-template-columns:200px 1fr;align-items:center;gap:16px"><span class="code">--line-control · 30% · toggles, steppers</span><span style="height:1px;background:var(--line-control)"></span></div><div style="display:grid;grid-template-columns:200px 1fr;align-items:center;gap:16px"><span class="code">--line-solid · 100% · buttons, fields, table heads</span><span style="height:1px;background:var(--line-solid)"></span></div></div>
</body></html>
