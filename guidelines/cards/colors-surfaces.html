<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px 24px;background:var(--surface-page)} .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)} .code{font-size:11px;color:var(--text-secondary);font-family:ui-monospace,Menlo,monospace}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"><div style="height:130px;background:var(--surface-page);color:var(--soul-ink);padding:12px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line-subtle)"><span style="font-family:var(--font-display);font-size:22px">Aa</span><span><span style="display:block;font-size:12px;font-weight:500">Page</span><span style="font-size:10.5px;opacity:.8">--surface-page</span></span></div><div style="height:130px;background:var(--surface-alt);color:var(--soul-ink);padding:12px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line-subtle)"><span style="font-family:var(--font-display);font-size:22px">Aa</span><span><span style="display:block;font-size:12px;font-weight:500">Alt section</span><span style="font-size:10.5px;opacity:.8">--surface-alt</span></span></div><div style="height:130px;background:var(--surface-inverse);color:var(--soul-paper);padding:12px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line-subtle)"><span style="font-family:var(--font-display);font-size:22px">Aa</span><span><span style="display:block;font-size:12px;font-weight:500">Inverse</span><span style="font-size:10.5px;opacity:.8">--surface-inverse</span></span></div><div style="height:130px;background:var(--surface-inverse-raised);color:var(--soul-paper);padding:12px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line-subtle)"><span style="font-family:var(--font-display);font-size:22px">Aa</span><span><span style="display:block;font-size:12px;font-weight:500">Card on dark</span><span style="font-size:10.5px;opacity:.8">--surface-inverse-raised</span></span></div><div style="height:130px;background:var(--surface-highlight);color:var(--soul-ink);padding:12px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line-subtle)"><span style="font-family:var(--font-display);font-size:22px">Aa</span><span><span style="display:block;font-size:12px;font-weight:500">Highlight</span><span style="font-size:10.5px;opacity:.8">--surface-highlight</span></span></div></div>
</body></html>
