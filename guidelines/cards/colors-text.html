<!-- @dsCard group="Colors" viewport="700x230" subtitle="Text roles on light and dark grounds" name="Text colours" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px 24px;background:var(--surface-page)} .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)} .code{font-size:11px;color:var(--text-secondary);font-family:ui-monospace,Menlo,monospace}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div style="padding:18px;background:var(--surface-page);border:1px solid var(--line-subtle);display:flex;flex-direction:column;gap:8px"><div style="color:var(--text-primary);font-size:15px">Primary — ink <span class="code" style="color:inherit;opacity:.7">--text-primary</span></div><div style="color:var(--text-secondary);font-size:15px">Secondary — stone 700 <span class="code" style="color:inherit;opacity:.7">--text-secondary</span></div><div style="color:var(--text-muted);font-size:15px">Muted / meta — stone 500 <span class="code" style="color:inherit;opacity:.7">--text-muted</span></div><div style="color:var(--text-accent);font-size:15px">Accent eyebrow — clay <span class="code" style="color:inherit;opacity:.7">--text-accent</span></div></div><div style="padding:18px;background:var(--surface-inverse);display:flex;flex-direction:column;gap:8px"><div style="color:var(--text-on-dark);font-size:15px">On dark — paper</div><div style="color:var(--text-on-dark-secondary);font-size:15px">On dark secondary — 80%</div><div style="color:var(--text-on-dark-muted);font-size:15px">On dark muted — 70%</div><div style="color:var(--text-on-dark-accent);font-size:15px">On dark accent — yellow</div></div></div>
</body></html>
