<!-- @dsCard group="Radius & borders" viewport="700x220" subtitle="Shadows only on floating layers — never on cards" name="Elevation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px 24px;background:var(--surface-page)} .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)} .code{font-size:11px;color:var(--text-secondary);font-family:ui-monospace,Menlo,monospace}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:10px 6px 24px"><div><div style="height:90px;background:var(--soul-paper);border:1px solid var(--line-subtle);box-shadow:var(--shadow-mega)"></div><div style="font-size:12px;margin-top:10px">Mega menu</div><div class="code">--shadow-mega</div></div><div><div style="height:90px;background:var(--soul-paper);border:1px solid var(--line-subtle);box-shadow:var(--shadow-drawer)"></div><div style="font-size:12px;margin-top:10px">Cart drawer</div><div class="code">--shadow-drawer</div></div><div><div style="height:90px;background:var(--soul-paper);border:1px solid var(--line-subtle);box-shadow:var(--shadow-toast)"></div><div style="font-size:12px;margin-top:10px">Toast</div><div class="code">--shadow-toast</div></div><div><div style="height:90px;background:var(--soul-paper);border:1px solid var(--line-subtle);filter:var(--shadow-object)"></div><div style="font-size:12px;margin-top:10px">Certificate (filter)</div><div class="code">--shadow-object</div></div></div>
</body></html>
