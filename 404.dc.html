<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: #27292D; color: #F4EFE5; font-family: "Be Vietnam Pro", system-ui, sans-serif; font-size: 15px; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: inherit; }
  button, input { font-family: inherit; color: inherit; }
  img { display: block; }
  :focus-visible { outline: 2px solid #FFD35B; outline-offset: 3px; }
  ::selection { background: #FFD35B; color: #27292D; }
</style>
</helmet>

<div data-screen-label="404" style="min-height: 100vh; display: flex; flex-direction: column; background: #27292D; color: #F4EFE5;">
  <header style="display: flex; justify-content: space-between; align-items: center; gap: 16px; height: 66px; padding: 0 clamp(16px,4vw,64px); border-bottom: 1px solid rgba(244,239,229,.14);">
    <a href="Home.html" aria-label="SOUL"><img src="assets/soul-logo-full-yellow.svg" alt="SOUL" style="height: 34px; width: auto;" /></a>
    <div role="group" aria-label="Language" style="display: flex; border: 1px solid rgba(244,239,229,.35); height: 32px;">
      <button type="button" aria-pressed="{{ isVi }}" onClick="{{ setVi }}" style="width: 38px; height: 30px; border: 0; background: {{ viBg }}; color: {{ viColor }}; font-size: 11px; letter-spacing: .1em; font-weight: 600; cursor: pointer;">VI</button>
      <button type="button" aria-pressed="{{ isEn }}" onClick="{{ setEn }}" style="width: 38px; height: 30px; border: 0; background: {{ enBg }}; color: {{ enColor }}; font-size: 11px; letter-spacing: .1em; font-weight: 600; cursor: pointer;">EN</button>
    </div>
  </header>

  <main style="flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 40px clamp(28px,5vw,96px); align-items: center; padding: clamp(48px,7vw,110px) clamp(16px,4vw,64px);">
    <div>
      <div style="display: flex; align-items: center; gap: 14px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #FFD35B;"><span style="width: 28px; height: 2px; background: #FFD35B;"></span><span>{{ t.eyebrow }}</span></div>
      <div aria-hidden="true" style="margin-top: 18px; font-family: Newsreader, Georgia, serif; font-weight: 300; font-size: clamp(120px, 18vw, 280px); line-height: .82; letter-spacing: -.05em; color: #FFD35B;">404</div>
      <h1 style="margin: 28px 0 0; max-width: 16ch; font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: clamp(34px,3.8vw,56px); line-height: 1.04; letter-spacing: -.025em; text-wrap: balance;">{{ t.title }}</h1>
      <p style="margin: 18px 0 0; max-width: 46ch; font-size: 16px; line-height: 1.7; color: rgba(244,239,229,.8); text-wrap: pretty;">{{ t.body }}</p>
      <form role="search" onSubmit="{{ submit }}" style="display: flex; align-items: center; gap: 12px; max-width: 520px; margin-top: 32px; border-bottom: 1px solid rgba(244,239,229,.6);">
        <label for="nf-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">{{ t.search }}</label>
        <input id="nf-q" type="search" value="{{ q }}" onChange="{{ onType }}" placeholder="{{ t.ph }}" style="flex: 1; min-width: 0; height: 56px; border: 0; background: transparent; color: #F4EFE5; font-size: 17px; outline: none;" />
        <button type="submit" style="flex: none; height: 40px; padding: 0 16px; background: #FFD35B; color: #27292D; border: 0; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; cursor: pointer;" style-hover="background: #F4EFE5;">{{ t.search }}</button>
      </form>
    </div>
    <nav aria-label="{{ t.where }}">
      <div style="font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: rgba(244,239,229,.7); margin-bottom: 12px;">{{ t.where }}</div>
      <ul style="list-style: none; margin: 0; padding: 0; border-top: 1px solid rgba(244,239,229,.2);">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <li><a href="{{ l.href }}" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 68px; border-bottom: 1px solid rgba(244,239,229,.16); font-family: Newsreader, Georgia, serif; font-size: clamp(22px,2vw,28px);" style-hover="color: #FFD35B;"><span>{{ l.label }}</span><span aria-hidden="true" style="font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 16px;">→</span></a></li>
        </sc-for>
      </ul>
    </nav>
  </main>

  <footer style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; padding: 20px clamp(16px,4vw,64px); border-top: 1px solid rgba(244,239,229,.14); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgba(244,239,229,.7);"><span>Crafted by Vietnamese Soul</span><span>© 2026 SOUL Fine Robusta</span></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;vi&quot;,&quot;en&quot;],&quot;default&quot;:&quot;vi&quot;,&quot;tsType&quot;:&quot;'vi' | 'en'&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  state = { lang: null, q: '' };
  T = {
    vi: { eyebrow: 'Không tìm thấy trang', title: 'Tách này chưa được pha.', body: 'Trang bạn tìm có thể đã được chuyển, đổi tên hoặc không còn tồn tại. Thử tìm kiếm, hoặc chọn một lối đi bên cạnh.', search: 'Tìm', ph: 'Tìm cà phê, bài viết, cửa hàng…', where: 'Đi tiếp',
      links: [['Trang chủ', 'Home.html'], ['Sản phẩm', 'Shop.dc.html'], ['Soulful Collection 2026', 'Shop.dc.html#c/soulful-flavours'], ['Cửa hàng Soul', 'Spaces.dc.html'], ['Câu hỏi thường gặp', 'Help.dc.html'], ['Liên hệ', 'Help.dc.html#contact']] },
    en: { eyebrow: 'Page not found', title: 'This cup hasn’t been brewed.', body: 'The page you’re looking for may have moved, been renamed or no longer exists. Try a search, or take one of the paths alongside.', search: 'Search', ph: 'Search coffee, articles, stores…', where: 'Keep going',
      links: [['Home', 'Home.html'], ['Shop', 'Shop.dc.html'], ['Soulful Collection 2026', 'Shop.dc.html#c/soulful-flavours'], ['Soul spaces', 'Spaces.dc.html'], ['FAQ', 'Help.dc.html'], ['Contact', 'Help.dc.html#contact']] }
  };
  componentDidUpdate(pp) { if (pp.lang !== this.props.lang) this.setState({ lang: null }); }
  renderVals() {
    const L = this.state.lang || this.props.lang || 'vi', t = this.T[L];
    return { t, q: this.state.q, onType: (e) => this.setState({ q: e.target.value }),
      submit: (e) => { e.preventDefault(); const q = this.state.q.trim(); location.href = 'Search.dc.html' + (q ? '#q=' + encodeURIComponent(q) : ''); },
      links: t.links.map(l => ({ label: l[0], href: l[1] })),
      isVi: L === 'vi', isEn: L === 'en', viBg: L === 'vi' ? '#F4EFE5' : 'transparent', enBg: L === 'en' ? '#F4EFE5' : 'transparent', viColor: L === 'vi' ? '#27292D' : '#F4EFE5', enColor: L === 'en' ? '#27292D' : '#F4EFE5',
      setVi: () => this.setState({ lang: 'vi' }), setEn: () => this.setState({ lang: 'en' }) };
  }
}
</script>
</body>
</html>
